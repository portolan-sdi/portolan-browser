name: Integration Tests — Code Generators

on:
  pull_request:
    branches:
      - main
      - v6
    paths:
      - 'src/codegen/**'
      - 'tests/integration/**'
  schedule:
    - cron: "0 0 1 * *"

jobs:
  codegen-integration:
    name: Run generated code (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, r, csharp, java, rust, curl, go]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.language }} integration
        run: bash tests/integration/run-tests.sh ${{ matrix.language }}
